<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lisbon Time Out Picks — Map</title>

    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        color: #1a1a1a;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 14px 20px;
        background: #091f2f;
        color: #fff;
        flex: 0 0 auto;
        z-index: 1100;
      }
      header h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 700;
      }
      header p {
        margin: 4px 0 0;
        font-size: 0.8rem;
        opacity: 0.85;
      }
      header a {
        color: #fff;
      }

      .map-wrap {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }
      #map {
        position: absolute;
        inset: 0;
      }

      /* Info element — populated when a pin is clicked. */
      #info {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 340px;
        max-width: calc(100% - 32px);
        max-height: calc(100% - 32px);
        overflow-y: auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
        z-index: 1000;
        padding: 20px 22px;
      }
      #info-close {
        position: absolute;
        top: 10px;
        right: 12px;
        border: none;
        background: none;
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
        color: #888;
      }
      #info-close:hover {
        color: #222;
      }
      .info-empty {
        color: #555;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .info-name {
        font-weight: 700;
        font-size: 1.25rem;
        margin: 0 24px 4px 0;
      }
      .info-dish {
        display: inline-block;
        color: #fff;
        background: #c8102e;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        padding: 3px 9px;
        border-radius: 999px;
        margin-bottom: 12px;
      }
      .info-row {
        font-size: 0.9rem;
        color: #333;
        margin: 0 0 8px;
        line-height: 1.45;
      }
      .info-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #8a8a8a;
        font-weight: 700;
        margin: 14px 0 4px;
      }
      .info-stalls {
        margin: 4px 0 0;
        padding-left: 18px;
        font-size: 0.88rem;
        color: #333;
      }
      .info-stalls li {
        margin-bottom: 3px;
      }
      .info-link {
        display: inline-block;
        margin-top: 14px;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        color: #1f5c99;
      }
      .info-link:hover {
        text-decoration: underline;
      }
      .geo-status {
        font-size: 0.78rem;
        opacity: 0.8;
        font-style: italic;
        white-space: nowrap;
      }
      .info-src {
        margin-top: 12px;
        font-size: 0.72rem;
        color: #8a8a8a;
      }
      .info-src--ok {
        color: #1a7f3c;
      }
      .info-src--fail {
        color: #b3541e;
      }
      .pin-dot {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        border: 2px solid #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }

      @media (max-width: 640px) {
        #info {
          top: auto;
          right: 0;
          left: 0;
          bottom: 0;
          width: 100%;
          max-width: 100%;
          max-height: 60%;
          border-radius: 14px 14px 0 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Lisbon Time Out Picks</h1>
      <p>
        Places from the local Lisbon CSV, including restaurants from Time Out's
        <a
          href="https://www.timeout.com/lisbon/restaurants/eat-like-a-local-in-lisbon"
          target="_blank"
          rel="noopener"
          >“How to eat like a local in Lisbon”</a
        >. Tap a pin for details.
        <span id="geo-status" class="geo-status"></span>
      </p>
    </header>

    <div class="map-wrap">
      <div id="map"></div>
      <aside id="info" aria-live="polite">
        <button id="info-close" aria-label="Close" style="display: none">
          &times;
        </button>
        <div id="info-body">
          <p class="info-empty">
            Tap any pin to see what it's known for, where it is, and a useful
            source link.
          </p>
        </div>
      </aside>
    </div>

    <script>
      const map = L.map("map", { scrollWheelZoom: false }).setView(
        [38.7186, -9.138],
        13,
      );

      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
        { maxZoom: 20, attribution: "&copy; OpenStreetMap, &copy; CARTO" },
      ).addTo(map);

      const infoBody = document.getElementById("info-body");
      const infoClose = document.getElementById("info-close");
      const statusEl = document.getElementById("geo-status");
      const CSV_URL = "timeout-lisbon-things-to-do.csv";

      const TYPE_COLORS = {
        aquarium: "#0072bc",
        bakery: "#c8102e",
        beach: "#00a6a6",
        "boat tour": "#2a6f97",
        bookshop: "#6c5b7b",
        cemetery: "#5b6770",
        "cultural complex": "#d1495b",
        "flea market": "#f28c28",
        "food hall": "#d95d39",
        hotel: "#6a4c93",
        museum: "#255f85",
        "music venue": "#8f2d56",
        nightclub: "#2d1e2f",
        restaurant: "#2e7d32",
        "rooftop bar": "#b45309",
        shop: "#4d908e",
        viewpoint: "#0081a7",
      };

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      function rowLink(row) {
        return (
          row.item_url ||
          row.booking_or_activity_url ||
          row.related_timeout_url ||
          row.source_page_url
        );
      }

      function detail(label, value) {
        if (!value) return "";
        return `<div class="info-label">${escapeHtml(label)}</div><p class="info-row">${escapeHtml(value)}</p>`;
      }

      function showInfo(row) {
        const note = row.notes
          ? `<p class="info-row" style="color:#666;font-style:italic">${escapeHtml(row.notes)}</p>`
          : "";
        const link = rowLink(row);
        infoBody.innerHTML = `
          <div class="info-name">${escapeHtml(row.name)}</div>
          <div class="info-dish">${escapeHtml(row.item_type)}</div>
          ${detail("Description", row.description)}
          ${detail("Address", [row.address, row.neighborhood_or_area].filter(Boolean).join("\n"))}
          ${detail("Price", row.price)}
          ${detail("Why it's here", row.verdict)}
          ${note}
          <a class="info-link" href="${escapeHtml(link)}" target="_blank" rel="noopener"
            >View details -></a
          >`;
        infoClose.style.display = "block";
      }

      function clearInfo() {
        infoBody.innerHTML =
          '<p class="info-empty">Tap any pin to see what it\'s known for, where it is, and a useful source link.</p>';
        infoClose.style.display = "none";
      }

      infoClose.addEventListener("click", clearInfo);

      function markerIcon(type) {
        const color = TYPE_COLORS[type] || "#555";
        return L.divIcon({
          className: "",
          html: `<div class="pin-dot" style="background:${color}"></div>`,
          iconSize: [18, 18],
          iconAnchor: [9, 9],
        });
      }

      function renderRows(rows) {
        const plotted = [];
        const missing = [];
        rows.forEach((row) => {
          const lat = Number(row.lat);
          const lng = Number(row.lng);
          if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
            missing.push(row);
            return;
          }
          const marker = L.marker([lat, lng], {
            title: row.name,
            icon: markerIcon(row.item_type),
          }).addTo(map);
          marker.on("click", () => showInfo(row));
          plotted.push(marker);
        });

        if (plotted.length) {
          map.fitBounds(L.featureGroup(plotted).getBounds().pad(0.12));
        }

        statusEl.textContent = ` · ${plotted.length} pins`;
        if (missing.length)
          statusEl.textContent += `, ${missing.length} missing coordinates`;
      }

      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete(results) {
          renderRows(results.data);
        },
        error(error) {
          statusEl.textContent = " · CSV failed to load";
          console.error(error);
        },
      });
    </script>
  </body>
</html>
