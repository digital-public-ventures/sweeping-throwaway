                - paragraph [ref=e723]: "Let's be honest here. There is nothing better than being able to head out town without breaking bank. So don't worry too much about setting budgets yet, there are many ways of exploring the city without spending one euro. It seems that the best things in life actually do come free - in Cascais at least they do. Whether it be going to museums or enjoying beautiful landscapes. There is a bit for everyone. Recommended: The best way to spend 48 hours in Cascais"
