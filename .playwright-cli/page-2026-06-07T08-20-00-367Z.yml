                - generic [ref=e745]:
                  - paragraph [ref=e746]: Sintra is a postcard. A postcard full of places cramming with tourists, of course, but also of quiet places to contemplate. And, above all, many tables to rest from the tour and refill your energy. With its fine architecture, significant monuments and museums and hidden treasures, is maybe the best choice for you if you are looking for some out-of-town hours. So save one day on your schedule, put on your hiking boots and visit Sintra, less than one hour away from Lisbon. You won’t regret it – scout's honor!
