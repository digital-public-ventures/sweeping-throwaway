                  - generic [ref=e692]: © Arlindo Camacho
                - paragraph [ref=e696]: "With its world-class restaurants, excelling in seafood, its reputation for style and long pedigree in art and culture, Portugal’s first city remains high on every discerning weekend-breaker’s hit-list. Want to know what to do in Lisbon? Wether you’re just here for a short visit (and if so, be sure to check out our best hotels list for a place to stay), or thinking of extending your stay permanently, this checklist will help you find the very best of Lisbon. Discover the landmarks, get a taste of some of that typical Portuguese food or uncover world flavours in the most typical neighbourhoods around the city. Done something on this list and loved it? Share it with the hashtag #TimeOutDoList and tag @TimeOutEverywhere. Find out more about how Time Out selects the very best things to do all over the world."
                - link "Read more" [ref=e699] [cursor=pointer]:
