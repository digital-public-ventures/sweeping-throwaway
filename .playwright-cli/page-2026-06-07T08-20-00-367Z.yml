                  - generic [ref=e349]: Mariana Valle Lima
                - paragraph [ref=e353]: Procópio was the first bar opened by collector and hotel manager Luís Pinto Coelho and has been in operation since 1972. The politicians Mário Soares and Sá Carneiro, as well as the comedian and actor Raul Solnado were all regulars in this space, which preserves many memories of the pre-revolution era within its walls. It had a retro style even back then, and that charm is even more pronounced now. The service remains very friendly, there’s a regular crowd who continue to visit time and again, and the soundtrack rarely strays far from jazz.
