                  - generic [ref=e768]: "Fotografia: Arlindo Camacho"
                - generic [ref=e771]: "The first Michelin Guide gala to be held in Portugal dictated just two more stars for Lisbon restaurants in the 2018-2019 season. In total there are now eight restaurants in the great Lisbon area that can proudly boast this star from the most important gastronomic guide in the world. You can find them from downtown Cascais to a quick trip to Sintra, or just by walking up and down Chiado, now considered the center of high gastronomy in Lisbon. All of them are, of course, on our meticulously compiled list of the best restaurants in Lisbon, so be sure to check it out if you’re looking to find some more affordable, yet still delicious options in the city. If you want to try the best of the city, all under one roof, then the Time Out Market is the place to visit. Recommended: The 148 best restaurants in Lisbon"
