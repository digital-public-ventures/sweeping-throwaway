                  - text: When Liliana Escalhão first moved from the small town of Castelo Branco to study in Lisbon, she set up home in Graça. After being forced to close Primeiro Andar at the Ateneu Comercial de Lisboa, she wanted to open another bar/restaurant/cultural association in the neighbourhood; and so, together with Vítor Augusto, she opened
                  - link "Má Língua" [ref=e286] [cursor=pointer]:
                    - /url: https://www.instagram.com/ma_lingua/?hl=en
