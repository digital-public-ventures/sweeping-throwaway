                  - generic [ref=e326]: "Fotografia: Arlindo Camacho"
                - paragraph [ref=e330]: Botequim, in Graça, was closed for 15 years, but the presence of poet Natália Correia (who first opened it in 1968) lives on – and not just in photographs. It’s now been modernised, but Botequim still has the old dark wood bar and has retained some of its original intellectual bohemian spirit. With light bites on offer and jazz flowing from the speakers, the stage is set for an ideal evening.
