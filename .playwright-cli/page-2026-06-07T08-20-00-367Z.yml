                    - text: "is one of the city’s jazz epicentres, with jam sessions that get the place shaking. Most of the schedule is shared on social media. However, at Café Dias (named after its founder Pedro Dias) the appeal goes well beyond the music. The best approach is to head down there, order one of the many snacks, and get ready to enjoy good music with a full belly. But be aware: coffees are only served when the music stops (after all, it’s the music that matters)."
